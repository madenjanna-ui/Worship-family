<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>Семейное поклонение</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bgMusic" src="assets/Peaceful Worship.mp3" loop preload="auto"></audio>

  <button class="music-toggle" id="musicToggle" type="button" aria-label="Музыка">
    <span id="musicIcon">♫</span>
  </button>

  <main class="cover" id="cover">

    <!-- Первая иллюстрация -->
    <section class="scene scene-one active" aria-hidden="true">
      <img src="assets/new-world.png" alt="">
    </section>

    <!-- Иллюстрация с людьми -->
    <section class="scene scene-two" aria-hidden="true">
      <img src="assets/family.png" alt="">
    </section>

    <!-- Текст появляется только после второй иллюстрации -->
    <section class="intro" id="intro">
      <div class="intro-glass">
        <div class="eyebrow">СЕМЕЙНОЕ ПОКЛОНЕНИЕ</div>

        <h1>Уточнение в понимании</h1>

        <div class="divider"></div>

        <blockquote>
          «Как свет утренней зари, который становится всё ярче и ярче
          до наступления полудня».
        </blockquote>

        <div class="reference">Притчи 4:18</div>

        <button class="continue-btn" id="continueBtn">
          <span class="play-icon">▶</span>
          К содержанию
        </button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
